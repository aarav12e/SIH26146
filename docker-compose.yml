version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih26146-bitcoin-monitor
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=bitcoin_forensics
      - USE_OFFLINE_STORAGE=auto
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/embedded_db:/app/data/embedded_db
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: sih26146-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
